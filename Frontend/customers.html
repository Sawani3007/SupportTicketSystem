<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customers</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Support Ticket System</h1>
    <nav>
        <a href="tickets.html">Tickets</a>
        <a href="customers.html">Customers</a>
    </nav>
    <hr>
    <h2>Customers</h2>
    <p id="loadingMessage">Loading customers...</p>
    <p id="errorMessage"></p>
    <input type="text"
           id="searchInput"
           placeholder="Search customers...">
    <br><br>
    <table>
        <thead>
            <tr>
                <th>Customer ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
            </tr>
        </thead>
        <tbody id="customerTableBody">
        </tbody>
    </table>
    <hr>
    <h2>Add Customer</h2>
    <form id="customerForm">
        <label for="name">Name:</label>
        <input type="text"
               id="name"
               required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email"
               id="email"
               required>
        <br><br>
        <label for="phone">Phone:</label>
        <input type="text"
               id="phone"
               required>
        <br><br>
        <button type="submit">
            Add Customer
        </button>
    </form>
    <script src="js/customers.js"></script>

</body>

</html>
